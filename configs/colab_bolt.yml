###############################################################################
# Colab finetune config for the locomotive multi-class detector (loco_v1).
#
# - Finetunes from the pretrained student checkpoint (RTv4-M-hgnet.pth); the
#   class head is auto-reset to 23 classes by the existing weight loader.
# - Single stage, no DINOv3 teacher (teacher_model: ~).
# - 1024 input, class-balanced sampling, photometric aug, EMA, per-class AP.
#
# Suggested launch (T4, effective batch = 2 * 8 = 16):
#   python train.py configs/colab_bolt.yml \
#     --device cuda --num-workers 2 --accum-steps 8 \
#     --clip-grad-norm 0.1 --eval-every 1 \
#     --output-dir /content/drive/MyDrive/rtdetr_out
# Resume after a disconnect:
#   ... --resume /content/drive/MyDrive/rtdetr_out/latest.pt
###############################################################################

task: detection

model: RTv4
criterion: RTv4Criterion
postprocessor: PostProcessor

use_focal_loss: True
# MUST match train/val image_size below; the model builds anchors from this.
eval_spatial_size: [1024, 1024]
checkpoint_freq: 4
output_dir: ./outputs/colab_bolt

# Finetune start point. The loader keeps backbone/encoder/decoder weights and
# skips the mismatched class-head tensors automatically.
student_checkpoint: ./pretrain/RTv4-M-hgnet.pth
teacher_model: ~

# Exponential moving average of weights (initialized AFTER weight loading).
ema:
  enabled: True
  decay: 0.9998
  warmup: 1000

dataset:
  type: baseline
  root: ./datasets
  class_summary_csv: manifests/class_mapping.csv
  train_images: images
  train_annotations: labels
  train_manifest: ~
  train_split_csv: manifests/train_split.csv
  val_images: images
  val_annotations: labels
  val_manifest: ~
  val_split_csv: manifests/val_split.csv
  keep_difficult: False
  polygon_policy: exclude_sample

train_transforms:
  image_size: [1024, 1024]
  keep_ratio: True
  pad_value: 114
  pad_position: top_left
  hflip_prob: 0.5
  rotate_prob: 0.2
  rotate_degrees: 10.0
  # Pixel-space photometric jitter (runs before normalize; pretrained-safe).
  photometric_prob: 0.5
  brightness: 0.4
  contrast: 0.4
  saturation: 0.3

val_transforms:
  image_size: [1024, 1024]
  keep_ratio: True
  pad_value: 114
  pad_position: top_left
  hflip_prob: 0.0
  rotate_prob: 0.0
  rotate_degrees: 0.0

train_dataloader:
  batch_size: 4
  shuffle: True
  num_workers: 4
  drop_last: True
  pin_memory: True
  # Repeat-factor sampling up-weights rare-class images (train split only).
  class_balanced: True
  balance_threshold: 0.1

val_dataloader:
  batch_size: 4
  shuffle: False
  num_workers: 4
  drop_last: False
  pin_memory: True

RTv4:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer

HGNetv2:
  pretrained: False
  local_model_dir: ./pretrain/hgnetv2/
  freeze_at: -1
  freeze_norm: False
  name: 'B2'
  return_idx: [1, 2, 3]
  use_lab: True

HybridEncoder:
  in_channels: [384, 768, 1536]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: 'gelu'
  expansion: 1.0
  depth_mult: 0.67
  act: 'silu'

DFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_layers: 4
  eval_idx: -1
  # 23 classes, <=29 objects per image -> 100 queries is plenty and faster.
  num_queries: 100
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: default
  activation: silu
  mlp_act: silu

PostProcessor:
  num_top_queries: 100

RTv4Criterion:
  weight_dict:
    loss_mal: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
  losses: ['mal', 'boxes', 'local']
  alpha: 0.75
  gamma: 1.5
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0

train:
  name: train
  output_dir: ./outputs/colab_bolt
  epochs: 60
  optimizer:
    type: AdamW
    lr: 0.0001
    betas: [0.9, 0.999]
    weight_decay: 0.0001
  scheduler:
    # Linear warmup for warmup_iter steps, then cosine decay to min_lr_ratio*lr
    # across the remaining steps (spans the full run end to end).
    type: warmup_cosine
    warmup_iter: 1000
    start_factor: 0.1
    min_lr_ratio: 0.01
