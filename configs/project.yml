task: detection

model: RTv4
criterion: RTv4Criterion
postprocessor: PostProcessor

use_focal_loss: True
eval_spatial_size: [640, 640]
checkpoint_freq: 4
output_dir: ./outputs/project

student_checkpoint: ./pretrain/RTv4-M-hgnet.pth
teacher_model: ~

dataset:
  type: baseline # mixed | voc_xml | baseline
  root: ../../../Documents/Playground/train_data/datasets/phase1_joint_detection_baseline
  class_summary_csv: manifests/class_summary.csv
  train_images: images
  train_annotations: labels
  train_manifest: ~
  train_split_csv: manifests/trainval_split_90_10/train_split.csv
  val_images: images
  val_annotations: labels
  val_manifest: ~
  val_split_csv: manifests/trainval_split_90_10/val_split.csv
  keep_difficult: False
  polygon_policy: exclude_sample

train_transforms:
  image_size: [640, 640]
  keep_ratio: True
  pad_value: 114
  pad_position: top_left
  hflip_prob: 0.5
  rotate_prob: 0.0
  rotate_degrees: 0.0
  # Photometric augmentation (pixel-space only, runs before normalize; does NOT
  # affect pretrained-weight loading). Set photometric_prob: 0.0 to disable.
  photometric_prob: 0.5
  brightness: 0.4
  contrast: 0.4
  saturation: 0.3

val_transforms:
  image_size: [640, 640]
  keep_ratio: True
  pad_value: 114
  pad_position: top_left
  hflip_prob: 0.0
  rotate_prob: 0.0
  rotate_degrees: 0.0

train_dataloader:
  batch_size: 4
  shuffle: True
  num_workers: 4
  drop_last: True
  pin_memory: True
  # Repeat-factor sampling to up-weight rare-class images (train split only).
  # repeat_factor(c) = max(1, sqrt(balance_threshold / image_freq(c))); a class
  # is up-weighted only when its image frequency < balance_threshold. The rarest
  # kept class here has freq ~0.017, so use ~0.1 (higher = more aggressive).
  # Set class_balanced: False to disable.
  class_balanced: True
  balance_threshold: 0.1

val_dataloader:
  batch_size: 4
  shuffle: False
  num_workers: 4
  drop_last: False
  pin_memory: True

RTv4:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer

HGNetv2:
  pretrained: False
  local_model_dir: ./pretrain/hgnetv2/
  freeze_at: -1
  freeze_norm: False
  name: 'B2'
  return_idx: [1, 2, 3]
  use_lab: True

HybridEncoder:
  in_channels: [384, 768, 1536]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: 'gelu'
  expansion: 1.0
  depth_mult: 0.67
  act: 'silu'

DFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: default
  activation: silu
  mlp_act: silu

PostProcessor:
  num_top_queries: 300

RTv4Criterion:
  weight_dict:
    loss_mal: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
  losses: ['mal', 'boxes', 'local']
  alpha: 0.75
  gamma: 1.5
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0

train:
  name: train
  output_dir: ./outputs/project
  epochs: 24
  optimizer:
    type: AdamW
    lr: 0.0001
    betas: [0.9, 0.999]
    weight_decay: 0.0001
  scheduler:
    type: cosine
