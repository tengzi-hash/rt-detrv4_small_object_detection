task: detection

model: RTv4
criterion: RTv4Criterion
postprocessor: PostProcessor

use_focal_loss: True
eval_spatial_size: [640, 640]
checkpoint_freq: 4
output_dir: ./outputs/project_distill

# The training entrypoint should load the official RT-DETRv4 checkpoint into
# the student before the first stage starts.
student_checkpoint: ./pretrain/RTv4-M-hgnet.pth

dataset:
  type: baseline # mixed | voc_xml | baseline
  root: ./datasets
  class_summary_csv: manifests/class_mapping.csv
  train_images: images
  train_annotations: labels
  train_manifest: ~
  train_split_csv: manifests/train_split.csv
  val_images: images
  val_annotations: labels
  val_manifest: ~
  val_split_csv: manifests/val_split.csv
  keep_difficult: False
  polygon_policy: exclude_sample

train_transforms:
  image_size: [640, 640]
  keep_ratio: True
  pad_value: 114
  pad_position: top_left
  hflip_prob: 0.5
  rotate_prob: 0.0
  rotate_degrees: 0.0

val_transforms:
  image_size: [640, 640]
  keep_ratio: True
  pad_value: 114
  pad_position: top_left
  hflip_prob: 0.0
  rotate_prob: 0.0
  rotate_degrees: 0.0

train_dataloader:
  batch_size: 2
  shuffle: True
  num_workers: 4
  drop_last: True
  pin_memory: True

val_dataloader:
  batch_size: 2
  shuffle: False
  num_workers: 4
  drop_last: False
  pin_memory: True

RTv4:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer

HGNetv2:
  pretrained: False
  local_model_dir: ./pretrain/hgnetv2/
  freeze_at: -1
  freeze_norm: False
  name: 'B2'
  return_idx: [1, 2, 3]
  use_lab: True

HybridEncoder:
  in_channels: [384, 768, 1536]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: 'gelu'
  expansion: 1.0
  depth_mult: 0.67
  act: 'silu'
  distill_teacher_dim: 768

DFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: default
  activation: silu
  mlp_act: silu

PostProcessor:
  num_top_queries: 300

RTv4Criterion:
  weight_dict:
    loss_mal: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    # Fixed fallback weight used only when adaptive modulation is disabled.
    loss_distill: 1.0
  losses: ['mal', 'boxes', 'local', 'distill']
  alpha: 0.75
  gamma: 1.5
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0
  distill_adaptive_params:
    enabled: True
    # Percent targets for GAM. The trainer normalizes these as 11% +/- 1%.
    rho: 11
    delta: 1
    # Stage-specific overrides below should control the actual starting weight.
    default_weight: 2.0
    # Guardrails to keep GAM from overreacting to one noisy epoch.
    min_weight: 0.25
    max_weight: 4.0
    max_update_factor: 2.0

teacher_model:
  type: DINOv3TeacherModel
  dinov3_repo_path: ./vendor/dinov3
  dinov3_weights_path: pretrain/dinov3_vitb16_pretrain_lvd1689m.pth
  patch_size: 16
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

stages:
  - name: stage1
    output_dir: ./outputs/project_distill/stage1
    epochs: 8
    optimizer:
      type: AdamW
      lr: 0.0001
      betas: [0.9, 0.999]
      weight_decay: 0.0001
    scheduler:
      type: warmup
      warmup_iter: 500
    config_overrides:
      HGNetv2:
        freeze_stem_only: False
        freeze_at: 3
        freeze_norm: True
      RTv4Criterion:
        weight_dict:
          __replace__: True
          loss_mal: 1
          loss_bbox: 5
          loss_giou: 2
          loss_fgl: 0.15
          loss_ddf: 1.5
          loss_distill: 1.0
        distill_adaptive_params:
          default_weight: 2.0

  - name: stage2
    output_dir: ./outputs/project_distill/stage2
    epochs: 16
    optimizer:
      type: AdamW
      lr: 0.00005
      betas: [0.9, 0.999]
      weight_decay: 0.0001
    scheduler:
      type: cosine
    config_overrides:
      teacher_model: ~
      HGNetv2:
        freeze_at: -1
        freeze_norm: True
      RTv4Criterion:
        losses: ['mal', 'boxes', 'local']
        weight_dict:
          __replace__: True
          loss_mal: 1
          loss_bbox: 5
          loss_giou: 2
          loss_fgl: 0.15
          loss_ddf: 1.5
          loss_distill: 1.0
        distill_adaptive_params:
          enabled: False

  - name: stage3
    output_dir: ./outputs/project_distill/stage3
    epochs: 24
    optimizer:
      type: AdamW
      lr: 0.000025
      betas: [0.9, 0.999]
      weight_decay: 0.0001
    scheduler:
      type: constant
    config_overrides:
      teacher_model: ~
      HGNetv2:
        freeze_at: -1
        freeze_norm: True
      RTv4Criterion:
        losses: ['mal', 'boxes', 'local']
        weight_dict:
          __replace__: True
          loss_mal: 1
          loss_bbox: 5
          loss_giou: 2
          loss_fgl: 0.15
          loss_ddf: 1.5
          loss_distill: 1.0
        distill_adaptive_params:
          enabled: False
